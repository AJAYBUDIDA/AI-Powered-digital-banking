spring:
  application:
    name: digital-banking
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:digital_banking}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# Logging Configuration
logging:
  level:
    org:
      hibernate:
        SQL: ERROR
        type:
          descriptor:
            sql:
              BasicBinder: ERROR
    com.banking: INFO

# Application Custom Properties
app:
  jwtSecret: 5J3D9A2K7L1M8N4P5Q8R2S7T9U1V4W8X2Y3Z6A9B4C7D2E5F8G1H4J7K9L2M5N8O
  jwtExpirationMs: 86400000 # 24 hours
  aiServiceUrl: ${AI_SERVICE_URL:http://localhost:5000}
  fraudRiskThreshold: 0.70 # Transactions at or above this score are flagged as suspicious

# Swagger API Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
